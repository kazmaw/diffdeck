[package]
name = "diffdeck"
version = "0.1.0"
edition = "2021"
description = "Fast in-terminal diff viewer that emits difit-compatible line comments for Claude Code"
license = "MIT"
repository = "https://github.com/kazmaw/diffdeck"
homepage = "https://github.com/kazmaw/diffdeck"
readme = "README.md"
keywords = ["diff", "tui", "git", "review", "claude"]
categories = ["command-line-utilities", "development-tools"]
authors = ["kazmaw"]

[[bin]]
name = "diffdeck"
path = "src/main.rs"

[lib]
name = "diffdeck"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
syntect = "5"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
